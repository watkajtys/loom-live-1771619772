<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillTree Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13eca4",
                        "background-light": "#f6f8f7",
                        "background-dark": "#10221c", // Adjusted deep green-charcoal
                        "neutral-dark": "#1a2c26", // Derived from primary/bg for cards
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px", "md": "0.375rem"},
                },
            },
        }
    </script>
<style>
        /* Custom Utilities not covered by Tailwind config */
        .glow-text {
            text-shadow: 0 0 20px rgba(19, 236, 164, 0.3);
        }
        .bg-mesh {
             background-image: radial-gradient(at 0% 0%, hsla(158,18%,22%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(164,85%,49%,0.15) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(158,18%,22%,1) 0, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased overflow-hidden select-none h-screen w-screen flex flex-col relative">
<!-- Background Decoration -->
<div class="absolute inset-0 bg-mesh pointer-events-none z-0 opacity-60"></div>
<!-- Header / Logo Area -->
<div class="relative z-10 w-full flex justify-center pt-12 pb-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">account_tree</span>
<span class="text-xl font-bold tracking-tight text-white">SkillTree</span>
</div>
</div>
<!-- Main Content / Hero Area -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center w-full px-6 gap-8 pb-10">
<!-- Hero Illustration Wrapper -->
<div class="relative w-full aspect-square max-w-sm mx-auto flex items-center justify-center">
<!-- Abstract Digital Tree Representation -->
<div class="absolute inset-0 bg-primary/10 rounded-full blur-3xl opacity-30 transform scale-75"></div>
<!-- Main Image Card -->
<div class="w-full h-full bg-center bg-contain bg-no-repeat relative z-10 drop-shadow-2xl" data-alt="Abstract glowing digital tree network nodes connecting in cyberspace" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBFKs0hnF6V7KBQLYCkSuv2T29hCl-jASc5mPbdCfAH5OuPg3pg4agFQLRwccZZrd8NXkqloNXo4g3QdZ375JEgh15gsXsXn06WsHJhAS_z2obKYZGy0JECa5bDkblNABn9qDgiZ5Bx7J54aaWxXk5OKlBuXpCLQ8i1uL43tfXyR7vzzu7SIg5J-blA7qrL9IR8o7C2ZJlErSJi02iRP6TewVV34viywJq6Oqxnu0v1sJ0rfwPdS5U4gWl8uLXksEC4I2SFGZGMBj0");'>
<!-- Overlay Gradient for better text integration or just aesthetic -->
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-transparent to-transparent opacity-40"></div>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center text-center space-y-4 max-w-xs mx-auto">
<h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white leading-tight">
                Grow Your <span class="text-primary glow-text">Potential</span>
</h1>
<p class="text-slate-400 text-base font-medium leading-relaxed">
                Visualize your career growth. Connect with mentors. Master your craft with a personalized skill tree.
            </p>
</div>
</div>
<!-- Footer Actions -->
<div class="relative z-10 w-full px-6 pb-12 pt-4 flex flex-col gap-4 bg-gradient-to-t from-background-dark to-transparent">
<button class="w-full h-14 bg-primary hover:bg-green-400 active:scale-[0.98] transition-all rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(19,236,164,0.25)]">
<span class="text-background-dark text-lg font-bold">Get Started</span>
<span class="material-symbols-outlined ml-2 text-background-dark">arrow_forward</span>
</button>
<button class="w-full h-12 flex items-center justify-center rounded-xl bg-white/5 hover:bg-white/10 active:bg-white/5 transition-colors border border-white/10">
<span class="text-white font-medium">I already have an account</span>
</button>
<!-- iOS Home Indicator Safe Area Placeholder -->
<div class="h-1 w-full"></div>
</div>
</body></html>
