<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chronological Weathering Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#17cf54",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>.glass {
    background: rgba(17, 33, 22, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1)
    }
.canvas-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAB0sZf0gtEV4OIJnj6s7ntoGba2pfEc-Wg3WPiCAOHiAe3V7KKkTd3HeSKwRTxsHWlcXdGrIGiJOy5Ub3UVsp32lRhkH-JHxnNiw-e3hZA5_pI0MCFl67V1zi25urMrj5MCzOx9Y2H4u6PJ6auECUsmTRhFD-C3EzwZjd8fE--PuYtY9tLZtDinbuIEXQUzYcZxphlwZ4ExXi9bzGmA6nqhLD3VrQzmY3FJ9RHFlfYw-V9eA1vN_wFJN2MFYEswmjM6rPzyG01hie3);
    background-size: cover;
    background-position: center
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<div class="relative h-screen w-full flex flex-col">
<!-- Main Canvas Area -->
<div class="absolute inset-0 z-0 canvas-bg" data-alt="Stone ruins in a forest with mossy cracks and sunlight filtering through trees">
<div class="absolute inset-0 bg-gradient-to-t from-background-dark/80 via-transparent to-background-dark/40"></div>
</div>
<!-- Top Navigation Bar -->
<header class="relative z-10 flex items-center justify-between p-4 pt-12 glass border-t-0 border-x-0">
<button class="size-10 flex items-center justify-center rounded-full bg-slate-900/40 text-slate-100">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-center">
<h1 class="text-xl font-bold tracking-tight">Chronological Weathering</h1>
<p class="text-xs uppercase tracking-[0.2em] text-primary">Evolution Module V1</p>
</div>
<button class="px-4 py-2 bg-primary/20 border border-primary/30 rounded-full text-primary font-bold text-sm">
                EXPORT
            </button>
</header>
<!-- Right Side Weathering Toggles (Sidebar) -->
<aside class="absolute right-4 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-4">
<div class="glass p-2 rounded-2xl flex flex-col gap-2">
<button class="flex flex-col items-center justify-center size-14 rounded-xl text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">shutter_speed</span>
<span class="text-[10px] font-bold mt-1">EROSION</span>
</button>
<div class="w-8 h-[1px] bg-white/10 mx-auto"></div>
<button class="flex flex-col items-center justify-center size-14 rounded-xl bg-primary text-background-dark shadow-[0_0_15px_rgba(23,207,84,0.4)]">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1">energy_savings_leaf</span>
<span class="text-[10px] font-bold mt-1">FLORA</span>
</button>
<div class="w-8 h-[1px] bg-white/10 mx-auto"></div>
<button class="flex flex-col items-center justify-center size-14 rounded-xl text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">water_drop</span>
<span class="text-[10px] font-bold mt-1">OXIDIZE</span>
</button>
</div>
<button class="glass size-14 rounded-2xl flex items-center justify-center text-slate-100">
<span class="material-symbols-outlined">layers</span>
</button>
</aside>
<!-- Tool Overlay (Left) -->
<div class="absolute left-4 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-2">
<div class="glass rounded-xl flex flex-col">
<button class="p-3 border-b border-white/10"><span class="material-symbols-outlined">add</span></button>
<button class="p-3 border-b border-white/10"><span class="material-symbols-outlined">remove</span></button>
<button class="p-3"><span class="material-symbols-outlined">near_me</span></button>
</div>
<button class="glass p-3 rounded-xl"><span class="material-symbols-outlined">search</span></button>
</div>
<!-- Bottom Interface: Timeline Slider -->
<div class="mt-auto relative z-20 px-4 pb-8 pt-4 glass rounded-t-[2rem]">
<div class="flex justify-center mb-4">
<div class="px-4 py-1.5 bg-background-dark/80 rounded-full border border-primary/40 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">schedule</span>
<span class="text-primary font-bold text-lg tracking-widest">+432 YEARS</span>
</div>
</div>
<div class="relative w-full h-24 flex items-center justify-center">
<!-- Custom Timeline Track -->
<div class="absolute inset-0 flex items-center justify-between px-2 opacity-30 pointer-events-none">
<div class="w-[1px] h-6 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-6 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-6 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-3 bg-slate-100"></div>
<div class="w-[1px] h-6 bg-slate-100"></div>
</div>
<!-- Range Input Container -->
<div class="relative w-full group">
<div class="absolute top-1/2 -translate-y-1/2 left-0 right-0 h-1 bg-white/10 rounded-full">
<div class="h-full bg-primary w-[43%] rounded-full shadow-[0_0_10px_#17cf54]"></div>
</div>
<input class="relative w-full h-12 bg-transparent appearance-none cursor-pointer z-30 [&amp;::-webkit-slider-thumb]:appearance-none [&amp;::-webkit-slider-thumb]:w-8 [&amp;::-webkit-slider-thumb]:h-8 [&amp;::-webkit-slider-thumb]:bg-primary [&amp;::-webkit-slider-thumb]:rounded-full [&amp;::-webkit-slider-thumb]:border-4 [&amp;::-webkit-slider-thumb]:border-background-dark [&amp;::-webkit-slider-thumb]:shadow-lg [&amp;::-moz-range-thumb]:w-8 [&amp;::-moz-range-thumb]:h-8 [&amp;::-moz-range-thumb]:bg-primary [&amp;::-moz-range-thumb]:rounded-full [&amp;::-moz-range-thumb]:border-4 [&amp;::-moz-range-thumb]:border-background-dark [&amp;::-moz-range-thumb]:shadow-lg" max="1000" min="0" type="range" value="432"/>
</div>
</div>
<div class="flex justify-between px-2 -mt-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
<span>Present</span>
<span>1,000 Years Later</span>
</div>
</div>
<!-- Bottom Tab Bar (iOS Style) -->
<nav class="relative z-30 bg-background-dark border-t border-white/5 flex justify-around items-center pt-3 pb-8 px-6">
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">grid_view</span>
<span class="text-[10px] uppercase font-bold tracking-tighter">Canvas</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px] uppercase font-bold tracking-tighter">History</span>
</a>
<div class="relative -top-6">
<button class="size-14 bg-primary rounded-full border-4 border-background-dark shadow-xl flex items-center justify-center text-background-dark">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
<a class="flex flex-col items-center gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">save</span>
<span class="text-[10px] uppercase font-bold tracking-tighter">Saved</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] uppercase font-bold tracking-tighter">Tools</span>
</a>
</nav>
<!-- Status Bar Mock -->
<div class="absolute top-0 left-0 right-0 h-10 z-50 flex items-center justify-between px-8 text-white text-xs font-bold pointer-events-none">
<span>9:41</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[14px]">wifi</span>
<span class="material-symbols-outlined text-[14px]">battery_full</span>
</div>
</div>
</div>
</body></html>
